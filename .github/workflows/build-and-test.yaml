name: Build and test

on:
  pull_request:
  workflow_dispatch:
  workflow_call: {}

jobs:
  build:
    # Every OS builds (EnableWindowsTargeting); only Windows can run UI Automation, so only Windows tests.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Load nuget cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        if: runner.os == 'Windows'
        run: dotnet test --no-build --configuration Release --filter "Category!=UI" --logger GitHubActions

      # UI tests launch the fixture app and drive it with SendInput; they need the runner's interactive desktop.
      - name: UI test
        if: runner.os == 'Windows'
        run: dotnet test --no-build --configuration Release --filter "Category=UI" --logger GitHubActions
