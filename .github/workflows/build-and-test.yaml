name: Build and test

on:
  pull_request:
  workflow_dispatch:
  workflow_call: {}

# One run per pull request: a new commit cancels the run still in progress for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # WinUia is Windows-only (UI Automation COM, SendInput), so it is built and tested on Windows only.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Load nuget cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --filter "Category!=UI" --logger GitHubActions

      # UI tests launch an app and drive it with SendInput; they need the runner's interactive desktop.
      - name: UI test
        run: dotnet test --no-build --configuration Release --filter "Category=UI" --logger GitHubActions
